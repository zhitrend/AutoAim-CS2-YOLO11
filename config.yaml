# ===== 模型配置 =====
model_path: "model/best.pt"
use_gpu_capture: false

# ===== 屏幕区域 =====
screen_region:
  left: 0
  top: 10
  width: 1280
  height: 800

# ===== 目标检测 =====
names: ['tank']
aim_classes: [0]           # 要检测的类别索引
preferred_cls: [0]        # 优先选择的类别索引
confidence_threshold: 0.2  # 置信度阈值(0-1)
visualize: true           # 显示检测结果

# ===== 目标跟踪 =====
smoothing_alpha: 0.7      # 位置平滑系数(0-1, 越大响应越快)
velocity_alpha: 0.8       # 速度平滑系数(0-1, 越大响应越快)
prediction_ms: 30         # 预测提前时间(毫秒)
max_target_speed: 8000    # 最大目标速度(像素/秒)
prediction_enabled: true  # 开启预测

# ===== 鼠标控制 =====
# 移动模式: true=直接移动, false=平滑移动
direct_move_enabled: true  

# 平滑移动参数
mouse_gain: 0.85          # 移动增益 (0-1, 越大越快)
mouse_max_step: 60         # 单步最大移动距离(像素)
mouse_deadzone: 1          # 死区大小(像素)
repeat_moves: 3            # 每帧移动次数
loop_sleep: 0.003          # 循环延迟(秒)

# 直接移动参数
move_duration: 0.1         # 移动持续时间(秒)
move_steps: 10             # 移动步数

# ===== 日志 =====
log_file: "log/run.log"